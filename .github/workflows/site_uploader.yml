# Notion → crosshealthjp 公式サイト自動公開（WordPress版の置き換え・2026-07-06 オペ改訂）
# 旧 wordpress_uploader.yml と同じ時間帯に実行。tekutekuradio への投稿は停止済み。
name: Site Uploader (crosshealthjp)

on:
  schedule:
    - cron: '0 0 * * *'    # JST 9:00
    - cron: '0 5 * * *'    # JST 14:00
    - cron: '30 10 * * *'  # JST 19:30
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout watcher
        uses: actions/checkout@v4

      - name: Checkout crosshealthjp (deploy key)
        uses: actions/checkout@v4
        with:
          repository: jumpdeeptreeinside-droid/crosshealthjp
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
          # 🔴 pull --rebase を site_uploader.py の中でやるので、浅いクローンでは足りない
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Markdown

      - name: Run site uploader
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_ARTICLES_DIR: ${{ github.workspace }}/site/src/articles-data
        run: python src/site_uploader.py

      # 🔴 2026-10-04: push は site_uploader.py の中でやる（push が通ってから Notion に書く）。
      # ここは「消し忘れが残っていないか」の安全網だけ。commit も push もしない。
      - name: Leftover check (no commit here)
        if: always()
        run: |
          cd site
          if [ -n "$(git status --porcelain src/articles-data)" ]; then
            echo "::error::articles-data に未コミットの残りがあります（site_uploader.py が片付けに失敗）"
            git status --porcelain src/articles-data
            exit 1
          fi
          echo "残りなし"
